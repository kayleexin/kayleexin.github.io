<!DOCTYPE html>
<html>
<head>
    <title>JS work</title>

    <style>
        body{
            background-color: lightblue;
            font-family: Arial;
        }
        h1{
            text-align: center;
        }

        .box{
            background-color: white;
            width: 70%;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid pink;
            border-radius: 10px;
        }

        button{
            background-color: pink;
            padding: 10px;
            border: none;
            border-radius: 10px;
        }

        button:hover{
            background-color: lightgreen;
        }
    </style>
</head>

<body>

<h1>Website</h1>

<div class='box'>
    <h2>Password Checker</h2>

    <label>Password:</label>
    <input type=‘text’ id=‘password’>

    <button onclick=‘checkPassword()’>Check</button>

    <p id='passwordResult'></p>
</div>

<div class='box'>
    <h2>Security Clearance</h2>

    <label>Age:</label>
    <input type='text' id='age'><br><br>

    <label>Employee ID:</label>
    <input type='text' id='id'><br><br>

    <button onclick='checkClearance()'>Check</button>

    <p id='clearanceResult'></p>
</div>

<div class='box'>
    <h2>Login System</h2>

    <label>Username:</label>
    <input type='text' id='username'><br><br>

    <label>Password:</label>
    <input type='text' id='loginpassword'><br><br>

    <button onclick='signup()'>Sign Up</button>
    <button onclick='login()'>Login</button>

    <p id='loginResult'></p>
</div>

<div class='box'>
    <h2>Dark Mode</h2>

    <button onclick='darkMode()'>Dark Mode</button>
</div>

<div class='box'>
    <h2>Website Detector</h2>

    <label>URL:</label>
    <input type='text' id='url'>

    <button onclick='checkWebsite()'>Analyze</button>

    <p id='urlResult'></p>
</div>

<script>

    

function checkPassword(){

    let password = document.getElementById("password").value;

    if(password.length < 12){
        document.getElementById("passwordResult").innerHTML = "Password too short";
    }
    else{
        document.getElementById("passwordResult").innerHTML = "Strong Password";
    }
}

function checkClearance(){

    let age = document.getElementById("age").value;
    let id = document.getElementById("id").value;

    if(age >= 18 && (id == 'EMP')){
        document.getElementById("clearanceResult").innerHTML = "Access Granted";
    }
    else{
        document.getElementById("clearanceResult").innerHTML = "Access Denied";
    }
}

function signup(){

    savedUser = document.getElementById('name').value;
    savedPassword = document.getElementById('psw').value;

    document.getElementById('result').innerHTML = 'signup successful!';
}

function login(){

     let username = document.getElementById('name').value;
    let password = document.getElementById('psw').value;

    if(username == savedUser && password == savedPassword){

        document.getElementById('result').innerHTML = 'login successful!';
    }
    else{

        document.getElementById('result').innerHTML = 'login incorrect!';
    }
}


function darkMode(){

    document.body.style.backgroundColor = 'black';
    document.body.style.color = 'pink';
}

function checkWebsite(){

    let url = document.getElementById('url').value;

    if(url == 'https://'){
        document.getElementById('urlResult').innerHTML = 'Safe Website';
    }
    else{
        document.getElementById('urlResult').innerHTML = 'Dangerous Website';
    }
}

</script>

</body>
</html>
